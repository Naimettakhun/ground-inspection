<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ground Resistance Inspection — PTT GSP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Sarabun:wght@300;400;500;600;700&display=swap');

/* ═══════════════════════════════════════════
   TOKENS
   ═══════════════════════════════════════════ */
:root {
  --font-mono: 'IBM Plex Mono', monospace;
  --font-sans: 'Sarabun', sans-serif;
  --green: #16a34a; --yellow: #d97706; --red: #dc2626;
  --radius: 12px; --radius-sm: 8px;
}
[data-theme="light"] {
  --bg: #f0f4ff; --surface: #ffffff; --surface2: #eef1fb;
  --border: #d4d9ee; --text: #111827; --dim: #6b7280;
  --teal: #0284c7; --blue: #2563eb;
  --shadow: 0 1px 4px rgba(0,0,0,0.08);
}
[data-theme="dark"] {
  --bg: #0a0c14; --surface: #12151f; --surface2: #1a1e2e;
  --border: #252a40; --text: #e2e6f3; --dim: #6b7280;
  --teal: #38bdf8; --blue: #60a5fa;
  --shadow: 0 1px 4px rgba(0,0,0,0.4);
}

/* ═══════════════════════════════════════════
   RESET
   ═══════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* ═══════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════ */
.app { display:flex; flex-direction:column; height:100dvh; overflow:hidden; }

/* ═══════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════ */
.header {
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:var(--surface);
  border-bottom:1px solid var(--border); flex-shrink:0;
  box-shadow:var(--shadow);
}
.header-logo {
  width:36px; height:36px; border-radius:10px; flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),var(--blue));
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.header-title { font-size:14px; font-weight:700; line-height:1.3; }
.header-sub   { font-size:10px; color:var(--dim); font-family:var(--font-mono); }
.header-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.icon-btn {
  background:var(--surface2); border:1.5px solid var(--border);
  border-radius:var(--radius-sm); width:36px; height:36px; font-size:16px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--text); transition:all 0.15s;
}
.icon-btn:active { opacity:0.7; }
.btn-submit-all {
  background:var(--teal); color:#fff; border:none;
  border-radius:var(--radius-sm); padding:8px 16px;
  font-size:13px; font-weight:700; cursor:pointer;
  font-family:var(--font-sans); white-space:nowrap;
  box-shadow:0 2px 8px rgba(2,132,199,0.3);
}
.btn-submit-all:active { opacity:0.8; }

/* ═══════════════════════════════════════════
   PLANT SELECTOR
   ═══════════════════════════════════════════ */
.plant-bar {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:8px 12px; flex-shrink:0; display:flex; gap:6px;
  overflow-x:auto; scrollbar-width:none; align-items:center;
}
.plant-bar::-webkit-scrollbar { display:none; }
.plant-label { font-size:11px; color:var(--dim); font-weight:600;
  white-space:nowrap; margin-right:4px; flex-shrink:0; }
.plant-btn {
  background:var(--surface2); border:1.5px solid var(--border);
  color:var(--dim); border-radius:20px; padding:5px 14px;
  font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;
  font-family:var(--font-sans); flex-shrink:0; transition:all 0.15s;
}
.plant-btn.active {
  background:var(--blue); border-color:var(--blue);
  color:#fff; box-shadow:0 2px 8px rgba(37,99,235,0.3);
}
.plant-btn:active { opacity:0.8; }

/* ═══════════════════════════════════════════
   FILTER + SEARCH
   ═══════════════════════════════════════════ */
.toolbar {
  padding:8px 12px; flex-shrink:0;
  display:flex; flex-direction:column; gap:8px;
  background:var(--bg);
}
.search-row { display:flex; gap:8px; }
.search-input {
  flex:1; background:var(--surface); border:1.5px solid var(--border);
  color:var(--text); border-radius:var(--radius-sm); padding:9px 14px;
  font-size:14px; font-family:var(--font-sans); outline:none;
  box-shadow:var(--shadow);
}
.search-input:focus { border-color:var(--teal); }
.search-input::placeholder { color:var(--dim); }
.filter-bar { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.filter-bar::-webkit-scrollbar { display:none; }
.filter-btn {
  background:var(--surface); border:1.5px solid var(--border);
  color:var(--dim); border-radius:20px; padding:5px 14px;
  font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.filter-btn.active { background:var(--teal); border-color:var(--teal); color:#fff; }

/* ═══════════════════════════════════════════
   STATS
   ═══════════════════════════════════════════ */
.stats-bar {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:1px; background:var(--border); flex-shrink:0;
  border-top:1px solid var(--border);
}
.stat-cell { background:var(--surface); padding:7px 4px; text-align:center; }
.stat-val  { font-size:17px; font-weight:700; font-family:var(--font-mono); }
.stat-lbl  { font-size:9px; color:var(--dim); margin-top:1px; font-weight:600; letter-spacing:0.03em; }

/* ═══════════════════════════════════════════
   EQ LIST
   ═══════════════════════════════════════════ */
.eq-list { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }

.eq-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius); padding:12px 14px;
  cursor:pointer; display:flex; align-items:center; gap:12px;
  transition:all 0.15s; box-shadow:var(--shadow);
  -webkit-tap-highlight-color:transparent;
}
.eq-card:active { transform:scale(0.99); box-shadow:none; }
.eq-card.done    { border-color:rgba(22,163,74,0.4); }
.eq-card.partial { border-color:rgba(217,119,6,0.4); }
.eq-card.bad     { border-color:rgba(220,38,38,0.4); }

.eq-status { width:10px; height:10px; border-radius:50%; background:var(--border); flex-shrink:0; }
.eq-status.done    { background:var(--green); box-shadow:0 0 6px var(--green); }
.eq-status.partial { background:var(--yellow); box-shadow:0 0 6px var(--yellow); }
.eq-status.bad     { background:var(--red);    box-shadow:0 0 6px var(--red); }

.eq-info { flex:1; min-width:0; }
.eq-tag  { font-family:var(--font-mono); font-size:13px; font-weight:700; }
.eq-meta { font-size:11px; color:var(--dim); margin-top:2px; }
.eq-plant-badge {
  font-size:9px; background:var(--surface2); border:1px solid var(--border);
  border-radius:4px; padding:1px 5px; color:var(--dim); font-family:var(--font-mono);
  margin-left:4px;
}

.eq-summary { text-align:right; flex-shrink:0; }
.eq-etotal  { font-family:var(--font-mono); font-size:13px; font-weight:700; }
.eq-emain   { font-family:var(--font-mono); font-size:10px; color:var(--dim); }
.eq-sent    { font-size:9px; color:var(--green); margin-top:2px; }

/* ═══════════════════════════════════════════
   MODAL (BOTTOM SHEET)
   ═══════════════════════════════════════════ */
.modal-overlay {
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,0.45); display:none; align-items:flex-end;
  backdrop-filter:blur(2px);
}
.modal-overlay.open { display:flex; }
.modal {
  width:100%; max-height:95dvh;
  background:var(--surface); border-radius:24px 24px 0 0;
  border-top:1.5px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 -8px 40px rgba(0,0,0,0.15);
}
.modal-handle {
  width:40px; height:4px; background:var(--border);
  border-radius:2px; margin:12px auto 0; flex-shrink:0;
}
.modal-header {
  display:flex; align-items:flex-start; gap:10px;
  padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.modal-tag     { font-family:var(--font-mono); font-size:15px; font-weight:700; }
.modal-plant   { font-size:11px; color:var(--teal); font-weight:600; margin-top:2px; }
.modal-desc    { font-size:11px; color:var(--dim); margin-top:2px; }
.modal-close {
  margin-left:auto; background:var(--surface2); border:1.5px solid var(--border);
  color:var(--dim); border-radius:var(--radius-sm); width:34px; height:34px;
  font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.modal-body { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:14px; }

/* ═══════════════════════════════════════════
   SECTION TITLE
   ═══════════════════════════════════════════ */
.section-title {
  font-size:10px; color:var(--teal); text-transform:uppercase;
  letter-spacing:0.1em; font-weight:700; padding-bottom:6px;
  border-bottom:1px solid var(--border);
}

/* ═══════════════════════════════════════════
   INSPECTOR FORM (บังคับกรอก)
   ═══════════════════════════════════════════ */
.inspector-form {
  background:linear-gradient(135deg,rgba(2,132,199,0.05),rgba(37,99,235,0.04));
  border:1.5px solid rgba(2,132,199,0.2); border-radius:var(--radius);
  padding:12px 14px; display:flex; flex-direction:column; gap:10px;
}
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.form-field { display:flex; flex-direction:column; gap:4px; }
.form-field.full { grid-column:1/-1; }
.form-label {
  font-size:10px; font-weight:700; color:var(--teal);
  text-transform:uppercase; letter-spacing:0.06em;
  display:flex; align-items:center; gap:4px;
}
.required-star { color:var(--red); }
.form-input {
  background:var(--surface); border:1.5px solid var(--border);
  color:var(--text); border-radius:var(--radius-sm);
  padding:9px 12px; font-size:14px; font-family:var(--font-sans); outline:none;
}
.form-input:focus { border-color:var(--teal); }
.form-input.error { border-color:var(--red) !important; background:#fef2f2; }
.form-input::placeholder { color:var(--dim); }
.form-err { font-size:10px; color:var(--red); display:none; }
.form-err.show { display:block; }

/* ═══════════════════════════════════════════
   PHOTO + PINS
   ═══════════════════════════════════════════ */
.photo-zone {
  position: relative; 
  border-radius: var(--radius); 
  overflow: hidden;          
  background: #08090f; 
  border: 1.5px solid var(--border); 
  height: 55vh;              
  min-height: 400px;
  touch-action: none;        
  user-select: none;
  display: flex;             /* ดันภาพรวมทั้งหมดให้อยู่กึ่งกลางกล่องสีดำ */
  align-items: center;       
  justify-content: center;   
}

/* กล่องชั้นในที่จะบีบตัวเองให้กว้างยาวเท่ากับเนื้อรูปภาพจริงพอดีเป๊ะ */
.photo-container {
  position: relative;
  display: inline-block;
  max-width: 100%;
  max-height: 100%;
  transform-origin: center center;
}

.photo-container img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 55vh;
  object-fit: contain;
  pointer-events: none;
}
.photo-placeholder {
  min-height:120px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;
  color:var(--dim); font-size:13px; padding:16px;
}
.photo-placeholder .icon { font-size:32px; }
.pin {
  position: absolute;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  z-index: 10;
}
.pin-circle {
  width: 36px; 
  height: 36px; 
  border-radius: 50%; 
  border: 2.5px solid;
  display: flex; 
  align-items: center; 
  justify-content: center;
  font-family: var(--font-mono); 
  font-size: 10px; 
  font-weight: 700;
  backdrop-filter: blur(6px); 
  background: rgba(0,0,0,0.65); 
  color: #fff;
  transition: transform 0.1s;
  flex-shrink: 0;           /* ล็อกความกว้างวงกลมไม่ให้โดนตัวหนังสือยาวๆ ดันเบี้ยว */
  box-sizing: border-box; 
}

/* หากตัวอักษรข้างในยาวเกิน 2 ตัว (เช่น E-MAIN) จะย่อขนาดฟอนต์ให้เล็กลงอัตโนมัติเพื่อให้ขนาดวงกลมเท่าเดิม */
.pin-circle:not(:empty) {
  font-size: 8px; 
}
.pin-circle:has([style*="color"]), 
.pin-circle {
  font-size: 10px;
}
.pin:active .pin-circle { transform:scale(0.88); }
.pin-circle.empty { border-color:rgba(255,255,255,0.5); }
.pin-circle.ok    { border-color:#4ade80; box-shadow:0 0 0 5px rgba(74,222,128,0.25); }
.pin-circle.warn  { border-color:#fbbf24; box-shadow:0 0 0 5px rgba(251,191,36,0.25); }
.pin-circle.bad   { border-color:#f87171; box-shadow:0 0 0 5px rgba(248,113,113,0.25); }
.pin-val {
  position:absolute; top:38px; left:50%; transform:translateX(-50%);
  font-family:var(--font-mono); font-size:9px; white-space:nowrap;
  background:rgba(0,0,0,0.8); color:#fff; border-radius:4px; padding:2px 5px;
  pointer-events:none; font-weight:600;
}

/* ═══════════════════════════════════════════
   E INPUT GRID
   ═══════════════════════════════════════════ */
.e-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
.e-cell {
  background:var(--surface); border:2px solid var(--border);
  border-radius:var(--radius); padding:10px 12px; cursor:pointer;
  transition:border-color 0.15s, box-shadow 0.15s, background 0.15s;
  box-shadow:var(--shadow);
}
.e-cell.active { border-color:var(--teal); box-shadow:0 0 0 4px rgba(2,132,199,0.12); }
.e-cell.ok   { border-color:#16a34a; background:#f0fdf4; }
.e-cell.warn { border-color:#d97706; background:#fffbeb; }
.e-cell.bad  { border-color:#dc2626; background:#fef2f2; }
[data-theme="dark"] .e-cell.ok   { background:rgba(74,222,128,0.07); }
[data-theme="dark"] .e-cell.warn { background:rgba(251,191,36,0.07); }
[data-theme="dark"] .e-cell.bad  { background:rgba(248,113,113,0.07); }

.e-label { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.e-badge {
  font-family:var(--font-mono); font-size:12px; font-weight:700;
  background:var(--teal); color:#fff; border-radius:6px; padding:3px 10px;
}
.e-desc { font-size:10px; color:var(--dim); font-weight:500; }
.e-input {
  width:100%; background:transparent; border:none;
  color:var(--text); font-family:var(--font-mono); font-size:22px;
  font-weight:700; outline:none; padding:0; caret-color:var(--teal);
}
.e-input::placeholder { color:var(--border); font-size:18px; font-weight:400; }
.e-input.ok   { color:var(--green); }
.e-input.warn { color:var(--yellow); }
.e-input.bad  { color:var(--red); }
.e-unit { font-size:10px; color:var(--dim); margin-top:3px; font-weight:600; }
.emain-cell {
  border-color:var(--blue) !important;
  background:linear-gradient(135deg,rgba(2,132,199,0.05),rgba(37,99,235,0.05));
}
[data-theme="dark"] .emain-cell { background:rgba(96,165,250,0.07); }
.emain-cell .e-badge { background:var(--blue); }

/* ═══════════════════════════════════════════
   RESULT ROW
   ═══════════════════════════════════════════ */
.result-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.result-box {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow);
}
.result-box-lbl { font-size:10px; color:var(--dim); margin-bottom:4px; font-weight:600; }
.result-box-val { font-family:var(--font-mono); font-size:22px; font-weight:700; }
.result-box-sub { font-size:10px; color:var(--dim); margin-top:3px; }
.result-pass  { color:var(--green); }
.result-fail  { color:var(--red); }
.result-empty { color:var(--border); }

/* ═══════════════════════════════════════════
   VERDICT BOX
   ═══════════════════════════════════════════ */
.verdict-box {
  border-radius:var(--radius); padding:14px 16px;
  display:flex; align-items:center; gap:12px;
  border:2px solid;
}
.verdict-box.pass   { background:#f0fdf4; border-color:#16a34a; color:#166534; }
.verdict-box.fail   { background:#fef2f2; border-color:#dc2626; color:#991b1b; }
.verdict-box.empty  { background:var(--surface2); border-color:var(--border); color:var(--dim); }
[data-theme="dark"] .verdict-box.pass { background:rgba(74,222,128,0.1); }
[data-theme="dark"] .verdict-box.fail { background:rgba(248,113,113,0.1); }
.verdict-icon  { font-size:28px; flex-shrink:0; }
.verdict-label { font-size:16px; font-weight:700; }
.verdict-sub   { font-size:11px; margin-top:2px; opacity:0.8; }

/* ═══════════════════════════════════════════
   REMARK
   ═══════════════════════════════════════════ */
.remark-input {
  width:100%; background:var(--surface); border:1.5px solid var(--border);
  color:var(--text); border-radius:var(--radius-sm); padding:10px 12px;
  font-size:14px; font-family:var(--font-sans); resize:none; outline:none;
  min-height:60px;
}
.remark-input:focus { border-color:var(--teal); }

/* ═══════════════════════════════════════════
   ACTION BUTTONS
   ═══════════════════════════════════════════ */
.action-row { display:flex; gap:8px; }
.btn {
  flex:1; padding:14px; border-radius:var(--radius); border:none;
  font-size:14px; font-weight:700; font-family:var(--font-sans);
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.btn-primary { background:var(--teal); color:#fff; box-shadow:0 2px 8px rgba(2,132,199,0.3); }
.btn-clear   { background:var(--surface2); border:1.5px solid var(--border); color:var(--red); flex:none; padding:14px 18px; }
.btn:active  { opacity:0.8; }

/* ═══════════════════════════════════════════
   SEND STATUS BANNER
   ═══════════════════════════════════════════ */
.send-banner {
  border-radius:var(--radius-sm); padding:10px 14px;
  font-size:12px; font-weight:600; text-align:center;
  display:none;
}
.send-banner.sending { display:block; background:#fffbeb; color:#92400e; border:1px solid #fbbf24; }
.send-banner.success { display:block; background:#f0fdf4; color:#166534; border:1px solid #86efac; }
.send-banner.error   { display:block; background:#fef2f2; color:#991b1b; border:1px solid #fca5a5; }

/* ═══════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════ */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:#111827; color:#fff; border-radius:24px;
  padding:10px 22px; font-weight:700; font-size:14px;
  transition:transform 0.3s ease; z-index:300; white-space:nowrap;
  pointer-events:none; box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.toast.show { transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <div class="header-logo">⚡</div>
    <div>
      <div class="header-title">Ground Resistance Inspection</div>
      <div class="header-sub">PTT GSP — Area Inspection</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="clearAllData()" title="ล้างข้อมูลทั้งหมด">🗑</button>
      <button class="icon-btn" onclick="toggleTheme()" title="สลับธีม">🌓</button>
      <button class="btn-submit-all" onclick="submitAll()">📤 ส่งทั้งหมด</button>
    </div>
  </div>

  <!-- ═══ PLANT SELECTOR ═══ -->
  <div class="plant-bar">
    <span class="plant-label">โรง:</span>
    <button class="plant-btn active" onclick="selectPlant('ESP',this)">ESP</button>
    <button class="plant-btn" onclick="selectPlant('GSP1',this)">GSP1</button>
    <button class="plant-btn" onclick="selectPlant('GSP2',this)">GSP2</button>
    <button class="plant-btn" onclick="selectPlant('GSP3',this)">GSP3</button>

// ZONE C — STATE

let data         = {};
let activeFilter = 'all';
let activePlant  = 'ESP';
let activeTag    = null;

// ═══════════════════════════════════════════════════════════
// ZONE D — STORAGE
// ═══════════════════════════════════════════════════════════
function saveLocal() {
  try { localStorage.setItem('gi_data_v3', JSON.stringify(data)); } catch(e) {}
}
function loadLocal() {
  try { const s = localStorage.getItem('gi_data_v3'); if (s) data = JSON.parse(s); } catch(e) {}
}
function clearAllData() {
  if (!confirm('⚠ ล้างข้อมูลทั้งหมดในเครื่อง?\n(ข้อมูลที่ส่งไป Sheet แล้วยังคงอยู่)')) return;
  data = {};
  saveLocal();
  renderList();
  showToast('🗑 ล้างข้อมูลแล้ว');
}

// ═══════════════════════════════════════════════════════════
// ZONE E — HELPERS
// ═══════════════════════════════════════════════════════════
function rodColor(val, isMain) {
  if (val === '' || isNaN(parseFloat(val))) return 'empty';
  const v = parseFloat(val), lim = isMain ? LIMIT_EMAIN : LIMIT_ROD;
  return v <= lim ? 'ok' : v <= lim * 1.5 ? 'warn' : 'bad';
}
function calcETotal(tag) {
  const cfg = EQ_DATA[tag]; if (!cfg) return null;
  const d = data[tag] || {};
  let inv = 0, cnt = 0;
  for (let i = 1; i <= cfg.rods; i++) {
    const v = parseFloat(d['e'+i]);
    if (!isNaN(v) && v > 0) { inv += 1/v; cnt++; }
  }
  return cnt ? (1/inv).toFixed(3) : null;
}
function getEqStatus(tag) {
  const cfg = EQ_DATA[tag]; if (!cfg) return 'empty';
  const d = data[tag] || {};
  let filled = 0;
  for (let i = 1; i <= cfg.rods; i++) if (d['e'+i] !== undefined && d['e'+i] !== '') filled++;
  if (!filled) return 'empty';
  if (filled < cfg.rods) return 'partial';
  const et = parseFloat(calcETotal(tag)), em = parseFloat(d.emain || '');
  const mainOk = isNaN(em) || em <= LIMIT_EMAIN;
  const totOk  = isNaN(et) || et <= LIMIT_EMAIN;
  return (mainOk && totOk) ? 'pass' : 'fail';
}
function getResultText(tag) {
  const s = getEqStatus(tag);
  return s === 'pass' ? 'ผ่าน' : s === 'fail' ? 'ไม่ผ่าน' : s === 'partial' ? 'บางส่วน' : 'ยังไม่วัด';
}

// ═══════════════════════════════════════════════════════════
function selectPlant(plant, btn) {
  activePlant = plant;
  document.querySelectorAll('.plant-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

// ═══════════════════════════════════════════════════════════
// ZONE G — LIST RENDER
// ═══════════════════════════════════════════════════════════
function renderList() {
  const q    = (document.getElementById('searchInput').value || '').toLowerCase();
  const list = document.getElementById('eqList');
  list.innerHTML = '';
  let total=0, pass=0, fail=0, empty=0;

  Object.keys(EQ_DATA).forEach(tag => {
    const cfg = EQ_DATA[tag];
    // กรอง plant
    if (activePlant !== 'ALL' && cfg.plant !== activePlant) return;
    total++;
    const status = getEqStatus(tag);
    if (status === 'pass') pass++;
    else if (status === 'fail') fail++;
    else if (status === 'empty') empty++;

    const filterOk = activeFilter === 'all' || activeFilter === status;
    if (!filterOk || (q && !tag.toLowerCase().includes(q))) return;

    const d = data[tag] || {};
    const etotal = calcETotal(tag);
    const dotCls = status==='pass'?'done':status==='fail'?'bad':status==='partial'?'partial':'';
    const etCls  = !etotal?'result-empty':parseFloat(etotal)<=LIMIT_EMAIN?'result-pass':'result-fail';
    const sent   = d._sent ? `<div class="eq-sent">✓ ส่งแล้ว ${d._sent}</div>` : '';

    const card = document.createElement('div');
    card.className = `eq-card ${dotCls}`;
    card.innerHTML = `
      <div class="eq-status ${dotCls}"></div>
      <div class="eq-info">
        <div class="eq-tag">${tag}<span class="eq-plant-badge">${cfg.plant}</span></div>
        <div class="eq-meta">${cfg.desc} · ${cfg.rods} จุดวัด</div>
        ${sent}
      </div>
      <div class="eq-summary">
        <div class="eq-etotal ${etCls}">${etotal ? etotal+'Ω' : '—'}</div>
        <div class="eq-emain">E-Main <span>${d.emain ? d.emain+'Ω' : '—'}</span></div>
      </div>`;
    card.onclick = () => openModal(tag);
    list.appendChild(card);
  });

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPass').textContent  = pass;
  document.getElementById('statFail').textContent  = fail;
  document.getElementById('statEmpty').textContent = empty;
}

// ═══════════════════════════════════════════════════════════

function openModal(tag) {
  activeTag = tag;
  const cfg = EQ_DATA[tag]; if (!cfg) return;
  if (!data[tag]) data[tag] = {};
  document.getElementById('modalTag').textContent   = tag;
  document.getElementById('modalPlant').textContent = '📍 ' + cfg.plant;
  document.getElementById('modalDesc').textContent  = cfg.desc;
  renderModalBody(tag);
  document.getElementById('modalOverlay').classList.add('open');
  
  // เปิดใช้งานระบบซูมและจัดตำแหน่งหมุดล็อกสเกลภาพ
  setTimeout(() => {
    initZoomAndPan(tag);
    positionPins(tag);
  }, 60);
  
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  activeTag = null;
  renderList();
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function renderModalBody(tag) {
  const cfg = EQ_DATA[tag], d = data[tag] || {};
  const body = document.getElementById('modalBody');

  // ── Photo ──
  let photoHTML = '';
  if (cfg.photo && cfg.pins && cfg.pins.length) {
    const pinsHTML = cfg.pins.map(p => {
      const val = d[p.eid]||'', cls = rodColor(val, false);
      const colVar = cls==='ok'?'green':cls==='warn'?'yellow':cls==='bad'?'red':'dim';

  if (status === 'fail') { verdictIcon='❌'; verdictLabel='ไม่ผ่านเกณฑ์'; verdictSub=`ตรวจสอบค่าที่เกิน ${LIMIT_EMAIN}Ω`; verdictCls='fail'; }

            <div class="form-err" id="err-inspector">⚠ กรุณาระบุชื่อผู้ตรวจก่อนส่งข้อมูล</div>
          </div>

            <input class="form-input" id="inp-date" type="date"

    </div>

    <!-- Measurement -->
    <div>
      <div class="section-title">ค่าความต้านทาน — เรียงซ้าย → ขวา</div>
      <div class="e-grid" style="margin-top:8px">
        ${inputsHTML}
        <div class="e-cell emain-cell ${emCls}" id="ecell-${tag}-emain">
          <div class="e-label">
            <span class="e-badge" style="background:var(--blue)">E-MAIN</span>

          </div>
          <input class="e-input ${emCls}" id="einp-${tag}-emain"
            type="number" step="0.001" min="0" inputmode="decimal"
            value="${emainVal}" placeholder="0.000"
            oninput="onEChange('${tag}','emain',this.value)">

    <!-- Results -->

        <div class="result-box">
          <div class="result-box-lbl">E-Total (Parallel)</div>
          <div class="result-box-val ${totCls}" id="etotal-disp">${etotal ? etotal+'Ω' : '—'}</div>
          <div class="result-box-sub">เกณฑ์ &lt; ${LIMIT_EMAIN}Ω</div>
        </div>
        <div class="result-box">
          <div class="result-box-lbl">E-Main (วัดตรง)</div>

    <!-- Remark -->

// ═══════════════════════════════════════════════════════════
// ZONE I — PIN POSITIONING
// ═══════════════════════════════════════════════════════════
// ตัวแปรแกนสำหรับคำนวณและควบคุมการขยายภาพ (Scale & Pan)
let currentScale = 1, currentX = 0, currentY = 0;
let isDragging = false, startX = 0, startY = 0;
let initialPinchDist = 0, initialScale = 1;

function positionPins(tag) {
  const container = document.getElementById('pcontainer-' + tag);
  if (!container) return;

  // ปักเปอร์เซ็นต์หมุดลงบนขอบภาพชั้นในโดยตรงอย่างคงที่
  container.querySelectorAll('.pin[data-x]').forEach(pin => {
    const px = parseFloat(pin.dataset.x);
    const py = parseFloat(pin.dataset.y);
    pin.style.left = px + '%';
    pin.style.top = py + '%';
    pin.style.transform = 'translate(-50%, -50%)';
  });
}

function initZoomAndPan(tag) {
  const zone = document.getElementById('pzone-' + tag);
  const container = document.getElementById('pcontainer-' + tag);
  if (!zone || !container) return;

  // รีเซ็ตตำแหน่งให้กลับมาอยู่ตรงกลางพอดีทุกครั้งเมื่อเปิดอุปกรณ์ใหม่
  currentScale = 1; currentX = 0; currentY = 0;
  container.style.transform = `translate(0px, 0px) scale(1)`;

  // สัญญาณใช้นิ้วลาก/เมาส์ลากเลื่อนรูปภาพ (Pan)
  zone.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.pin')) return; 
    isDragging = true;
    zone.setPointerCapture(e.pointerId);
    startX = e.clientX - currentX;
    startY = e.clientY - currentY;
  });

  zone.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    currentX = e.clientX - startX;
    currentY = e.clientY - startY;
    container.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
  });

  zone.addEventListener('pointerup', (e) => {
    isDragging = false;
    zone.releasePointerCapture(e.pointerId);
  });

  // ใช้ scroll wheel บนเมาส์คอมพิวเตอร์เพื่อซูมเข้า-ออก
  zone.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = 0.15;
    if (e.deltaY < 0) {
      currentScale = Math.min(currentScale + zoomFactor, 4); // ซูมขยายสูงสุด 4 เท่า
    } else {
      currentScale = Math.max(currentScale - zoomFactor, 1); // ย่อต่ำสุดเท่าขนาดจริง
    }
    if (currentScale === 1) { currentX = 0; currentY = 0; }
    container.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
  }, { passive: false });

  // สัมผัสกาง 2 นิ้วถ่างซูมเข้าออกบนหน้าจอมือถือ (Pinch to Zoom)
  zone.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      initialScale = currentScale;
    }
  });

  zone.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && initialPinchDist > 0) {
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const factor = currentDist / initialPinchDist;
      currentScale = Math.min(Math.max(initialScale * factor, 1), 4);
      if (currentScale === 1) { currentX = 0; currentY = 0; }
      container.style.transform = `translate(${currentX}px, ${currentY}px) scale(${currentScale})`;
    }
  });

  zone.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) initialPinchDist = 0;
  });
}

window.addEventListener('resize', () => {
  if (activeTag) positionPins(activeTag);
});

// ═══════════════════════════════════════════════════════════
// ZONE J — INPUT HANDLERS
// ═══════════════════════════════════════════════════════════
function onEChange(tag, eid, val) {
  if (!data[tag]) data[tag] = {};
  data[tag][eid] = val;
  saveLocal();
  const isMain = eid === 'emain';
  const cls = rodColor(val, isMain), iCls = cls === 'empty' ? '' : cls;
  const cell = document.getElementById(`ecell-${tag}-${eid}`);
  const inp  = document.getElementById(`einp-${tag}-${eid}`);
  if (cell) cell.className = `e-cell${isMain?' emain-cell':''} ${iCls}`;
  if (inp)  inp.className  = `e-input ${iCls}`;
  updateResultDisplay(tag);
  updatePinColor(tag, eid, cls);
}

function updateResultDisplay(tag) {
  const etotal = calcETotal(tag);
  const d = data[tag] || {};
  const emainVal = d.emain || '';
  const etotalF = parseFloat(etotal), emainF = parseFloat(emainVal);
  const totCls  = !etotal   ? 'result-empty' : etotalF<=LIMIT_EMAIN ? 'result-pass' : 'result-fail';
  const mainCls = !emainVal ? 'result-empty' : emainF <=LIMIT_EMAIN ? 'result-pass' : 'result-fail';
  const te = document.getElementById('etotal-disp');
  const me = document.getElementById('emain-disp');
  if (te) { te.className = `result-box-val ${totCls}`; te.textContent = etotal ? etotal+'Ω' : '—'; }
  if (me) { me.className = `result-box-val ${mainCls}`; me.textContent = emainVal ? emainVal+'Ω' : '—'; }

  // Verdict
  const status = getEqStatus(tag);
  const vbox  = document.getElementById('verdict-box');
  const vlbl  = document.getElementById('verdict-label');
  const vsub  = document.getElementById('verdict-sub');
  if (!vbox) return;
  vbox.className = 'verdict-box ' + (status==='pass'?'pass':status==='fail'?'fail':'empty');
  if (status === 'pass') {
    vbox.querySelector('.verdict-icon').textContent = '✅';
    if (vlbl) vlbl.textContent = 'ผ่านเกณฑ์';
    if (vsub) vsub.textContent = `E-Total=${etotal}Ω, E-Main=${emainVal}Ω`;
  } else if (status === 'fail') {
    vbox.querySelector('.verdict-icon').textContent = '❌';
    if (vlbl) vlbl.textContent = 'ไม่ผ่านเกณฑ์';
    if (vsub) vsub.textContent = `ตรวจสอบค่าที่เกิน ${LIMIT_EMAIN}Ω`;
  } else {
    vbox.querySelector('.verdict-icon').textContent = '⏳';
    if (vlbl) vlbl.textContent = status==='partial'?'กรอกบางส่วน':'รอกรอกข้อมูล';
    if (vsub) vsub.textContent = 'กรอกค่าให้ครบทุกจุด';
  }
}

function updatePinColor(tag, eid, cls) {
  const pinc = document.getElementById(`pinc-${tag}-${eid}`);
  if (pinc) pinc.className = `pin-circle ${cls}`;
}

function focusEInput(tag, eid) {
  const el = document.getElementById(`einp-${tag}-${eid}`);
  if (el) { el.focus(); el.select(); }
}
function highlightPin(tag, eid) {
  document.querySelectorAll('.pin-circle').forEach(p => p.style.transform = '');
  const pinc = document.getElementById(`pinc-${tag}-${eid}`);
  if (pinc) pinc.style.transform = 'scale(1.2)';
}

function onRemarkChange(tag, val) {
  if (!data[tag]) data[tag] = {};
  data[tag].remark = val;
  saveLocal();
}

function clearEQ(tag) {
  if (!confirm(`ล้างข้อมูล ${tag}?`)) return;
  data[tag] = {};
  saveLocal();
  renderModalBody(tag);
  showToast('🗑 ล้างข้อมูลแล้ว');
}

// ═══════════════════════════════════════════════════════════
// ZONE K — META (ชื่อช่าง/วันที่/รอบ)
// ═══════════════════════════════════════════════════════════
function saveMeta() {
  const meta = {
    inspector: document.getElementById('inp-inspector')?.value || '',
    date:      document.getElementById('inp-date')?.value      || '',
    round:     document.getElementById('inp-round')?.value     || '',
    equip:     document.getElementById('inp-equip')?.value     || '',
  };
  localStorage.setItem('gi_meta_v3', JSON.stringify(meta));
}

function getMeta() {
  return JSON.parse(localStorage.getItem('gi_meta_v3') || '{}');
}

function validateMeta() {
  const inspector = document.getElementById('inp-inspector')?.value?.trim();
  const date      = document.getElementById('inp-date')?.value?.trim();
  let ok = true;
  const errI = document.getElementById('err-inspector');
  const errD = document.getElementById('err-date');
  const inpI = document.getElementById('inp-inspector');
  const inpD = document.getElementById('inp-date');

  if (!inspector) {
    ok = false;
    if (errI) errI.classList.add('show');
    if (inpI) inpI.classList.add('error');
  } else {
    if (errI) errI.classList.remove('show');
    if (inpI) inpI.classList.remove('error');
  }
  if (!date) {
    ok = false;
    if (errD) errD.classList.add('show');
    if (inpD) inpD.classList.add('error');
  } else {
    if (errD) errD.classList.remove('show');
    if (inpD) inpD.classList.remove('error');
  }
  return ok;
}

// ZONE L — SUBMIT TO GOOGLE SHEETS

function buildPayload(tag) {
  const cfg  = EQ_DATA[tag];
  const d    = data[tag] || {};
  const meta = getMeta();
  const etotal = calcETotal(tag);
  return {
    tag,
    plant:     cfg.plant,
    rods:      cfg.rods,
    inspector: meta.inspector || '',
    date:      meta.date      || '',
    round:     meta.round     || '',
    equip:     meta.equip     || '',
    e1: d.e1 ?? '', e2: d.e2 ?? '', e3: d.e3 ?? '',
    e4: d.e4 ?? '', e5: d.e5 ?? '',
    emain:  d.emain  || '',
    etotal: etotal   || '',
    result: getResultText(tag),
    remark: d.remark || '',
  };
}

// ฟังก์ชันจัดโครงสร้างข้อมูลส่งให้ตรงกับความต้องการของสคริปต์แผ่นงานตัวใหม่เป๊ะๆ
function buildPayload(tag) {
  const cfg = EQ_DATA[tag] || {};
  const d = data[tag] || {};
  const meta = getMeta();
  const etotal = calcETotal(tag);

  return {
    inspect_date:  meta.date || new Date().toISOString().slice(0,10), // วันที่ตรวจ
    inspect_round: meta.round || '1',                                 // รอบที่ตรวจ
    plant:         cfg.plant || 'UNKNOWN',                            // โรง (ESP/GSP1)
    eq_tag:        tag,                                               // รหัสตู้ไฟ
    inspector:     meta.inspector || 'ไม่ได้ระบุ',                        // ชื่อผู้ตรวจ
    meter_model:   meta.equip || 'Fluke 1625-2',                      // เครื่องมือวัด
    rod_count:     cfg.rods || 3,                                     // จำนวนจุดแท่งกราวด์
    e1_ohm:        d.e1 !== undefined && d.e1 !== '' ? parseFloat(d.e1) : null,
    e2_ohm:        d.e2 !== undefined && d.e2 !== '' ? parseFloat(d.e2) : null,
    e3_ohm:        d.e3 !== undefined && d.e3 !== '' ? parseFloat(d.e3) : null,
    e4_ohm:        d.e4 !== undefined && d.e4 !== '' ? parseFloat(d.e4) : null,
    e5_ohm:        d.e5 !== undefined && d.e5 !== '' ? parseFloat(d.e5) : null,
    etotal:        etotal ? parseFloat(etotal) : null,                // ค่าความต้านทานรวม
    emain:         d.emain !== undefined && d.emain !== '' ? parseFloat(d.emain) : null, // ค่าที่วัดตรง Main
    remark:        d.remark || '',                                    // หมายเหตุ
    appVersion:    '2.0'
  };
}

// 🛠️ ฟังก์ชันจัดระเบียบโครงสร้างชื่อตัวแปรให้ตรงล็อกกับที่ APPSCRIPT2.txt ต้องการเป๊ะๆ
function buildPayload(tag) {
  const cfg = EQ_DATA[tag] || {};
  const d = data[tag] || {};
  const meta = getMeta();
  const etotal = calcETotal(tag);

  return {
    inspect_date:  meta.date || new Date().toISOString().slice(0,10), // ตรงกับตัวแปรสคริปต์
    inspect_round: meta.round || '1',
    plant:         cfg.plant || 'UNKNOWN',
    eq_tag:        tag,
    inspector:     meta.inspector || 'ไม่ได้ระบุ',
    meter_model:   meta.equip || 'Fluke 1625-2',
    rod_count:     cfg.rods || 3,
    e1_ohm:        d.e1 !== undefined && d.e1 !== '' ? parseFloat(d.e1) : null,
    e2_ohm:        d.e2 !== undefined && d.e2 !== '' ? parseFloat(d.e2) : null,
    e3_ohm:        d.e3 !== undefined && d.e3 !== '' ? parseFloat(d.e3) : null,
    e4_ohm:        d.e4 !== undefined && d.e4 !== '' ? parseFloat(d.e4) : null,
    e5_ohm:        d.e5 !== undefined && d.e5 !== '' ? parseFloat(d.e5) : null,
    etotal:        etotal ? parseFloat(etotal) : null,
    emain:         d.emain !== undefined && d.emain !== '' ? parseFloat(d.emain) : null,
    remark:        d.remark || '',
    appVersion:    '2.0'
  };
}

async function submitOne(tag) {
  if (!validateMeta()) {
    showToast('⚠ กรุณากรอกชื่อผู้ตรวจและวันที่ก่อน');
    document.getElementById('inp-inspector')?.focus();
    return;
  }
  saveMeta();
  setBanner('sending', '⏳ กำลังส่งข้อมูลเข้าสู่ระบบคลาวด์...');
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST', 
      mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(buildPayload(tag))
    });
    const now = new Date().toLocaleTimeString('th-TH');
    if (!data[tag]) data[tag] = {};
    data[tag]._sent = now;
    saveLocal();
    setBanner('success', `✅ ส่งข้อมูลสำเร็จ เวลา ${now}`);
    showToast('✅ ส่งข้อมูลสำเร็จ');
  } catch(e) {
    setBanner('error', '❌ ส่งไม่ได้ ตรวจสอบอินเทอร์เน็ต แล้วลองใหม่');
    showToast('⚠ ส่งไม่ได้');
  }
}

async function submitAll() {
  const meta = getMeta();
  if (!meta.inspector || !meta.date) {
    showToast('⚠ กรุณากรอกชื่อผู้ตรวจและวันที่ในฟอร์มตู้ก่อนส่ง');
    return;
  }
  const tags = Object.keys(EQ_DATA).filter(t =>
    (activePlant === 'ALL' || EQ_DATA[t].plant === activePlant) &&
    getEqStatus(t) !== 'empty'
  );
  
  if (!tags.length) { 
    showToast('⚠ ไม่มีข้อมูลที่จะส่ง'); 
    return; 
  }
  
  if (!confirm(`ส่งข้อมูล ${tags.length} รายการไป Google Sheets?`)) return;

  showToast(`⏳ กำลังส่ง ${tags.length} รายการ...`);
  let ok = 0;
  for (const tag of tags) {
    try {
      await fetch(SCRIPT_URL, {
        method: 'POST', 
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildPayload(tag))
      });
      const now = new Date().toLocaleTimeString('th-TH');
      if (!data[tag]) data[tag] = {};
      data[tag]._sent = now;
      ok++;
    } catch(e) {
      console.error(e);
    }
  }
  saveLocal();
  renderList();
  showToast(`✅ ส่งสำเร็จ ${ok}/${tags.length} รายการ`);
}

function setBanner(type, msg) {
  const b = document.getElementById('send-banner');
  if (!b) return;
  b.className = `send-banner ${type}`;
  b.textContent = msg;
}

// ═══════════════════════════════════════════════════════════
// ZONE M — THEME
// ═══════════════════════════════════════════════════════════
function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('gi_theme_v3', next);
}

// ═══════════════════════════════════════════════════════════
// ZONE N — TOAST
// ═══════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
(function() {
  const theme = localStorage.getItem('gi_theme_v3') || 'light';
  document.documentElement.dataset.theme = theme;
  loadLocal();
  renderList();
})();
</script>
